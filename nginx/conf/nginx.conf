## Modifying this nginx.conf file to reflect where you'll mount the SSL certificates within the container.

server { 
    listen 80;  # HTTP port
    server_name _;  # Default server name
    location / {
        return 301 https://$host$request_uri;  # Redirect HTTP to HTTPS
    }
}

server {
    listen 443 ssl;    # HTTPS port
    server_name _;    # Default server name

    ssl_certificate /ssl/server.crt;  # Path to your SSL certificate
    ssl_certificate_key /ssl/server.key;  # Path to your SSL private key

     ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;  # HSTS header  

    root /usr/share/nginx/html;  # Path to your web content
    index index.html;  # Default index file

    location / {
        try_files $uri $uri/ =404;  # Serve files or return 404
    }

}
